name: Provision Self-Hosted Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate runner registration token
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT }}
        run: |
          TOKEN=$(curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" \
            | jq -r '.token')

          test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "TF_VAR_runner_token=$TOKEN" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init

      - name: Provision EC2 runner
        env:
          TF_VAR_repo_url: https://github.com/${{ github.repository }}
        run: terraform apply -auto-approve
